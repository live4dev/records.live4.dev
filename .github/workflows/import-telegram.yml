name: Import Telegram media

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-media-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install importer dependencies
        run: pip install -r requirements.txt

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Import new media
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNELS: ${{ vars.TELEGRAM_CHANNELS || 'records_live4dev' }}
          TELEGRAM_HISTORY_LIMIT: ${{ vars.TELEGRAM_HISTORY_LIMIT || '0' }}
          TELEGRAM_MAX_FILE_MB: ${{ vars.TELEGRAM_MAX_FILE_MB || '250' }}
          TELEGRAM_VIDEO_MAX_FILE_MB: ${{ vars.TELEGRAM_VIDEO_MAX_FILE_MB || '1100' }}
        run: |
          python tools/telegram_import.py --refresh --audio-only --min-duration-seconds 60
          TELEGRAM_MAX_FILE_MB="$TELEGRAM_VIDEO_MAX_FILE_MB" python tools/telegram_import.py --refresh --video-audio-only --min-duration-seconds 60

      - name: Commit imported records
        run: |
          git config user.name "records.live4.dev importer"
          git config user.email "records-importer@users.noreply.github.com"
          git add data/records.json data/import-state.json content
          if git diff --cached --quiet; then
            echo "No new records"
          else
            git commit -m "Import new Telegram records"
            git push
          fi
